name: yabolshe

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: yabolshe
      MYSQL_USER: yabolshe
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-8}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-1}
      WHISPER_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}
      HF_HOME: /models
    expose:
      - "8000"
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30m

  parakeet:
    build: ./parakeet
    restart: unless-stopped
    environment:
      PARAKEET_THREADS: ${PARAKEET_THREADS:-8}
      PARAKEET_MODEL_DIR: /models
      PARAKEET_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}
    expose:
      - "8000"
    volumes:
      - parakeet_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 20m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
      parakeet:
        condition: service_started
    environment:
      APP_ID: ${APP_ID:-yabolshe}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: mysql://yabolshe:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:3306/yabolshe
      # Optional for local/demo mode. Set a real key only on the production server.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      WHISPER_URL: http://whisper:8000
      PARAKEET_URL: http://parakeet:8000
      LOCAL_PARAKEET_MODEL: nvidia/parakeet-tdt-0.6b-v3:q8_0:cpu
      LOCAL_WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-small}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}
      UPLOAD_DIR: /app/data/uploads
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
  whisper_models:
  parakeet_models:
